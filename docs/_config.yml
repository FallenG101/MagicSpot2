title: MagicSpot
magicspot_version: "2.0.1"
upstream_version: "0.12.0"
description: A native Spotify app with improved lyrics and a neutral OLED theme.
lang: en-US
timezone: America/New_York
url: ""
baseurl: ""
logo: /assets/images/logo.svg
image: /magicspot/oled-review/after-oled-normal.png

markdown: kramdown
kramdown:
  input: GFM

permalink: pretty
theme: jekyll-vitepress-theme

collections:
  guide:
    output: true
    permalink: "/:name/"
  reference:
    output: true
    permalink: "/:name/"

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /magicspot/oled-review/after-oled-normal.png
      topics:
        - Spotify client
        - Rust
        - egui
        - librespot
        - Spotify Connect
        - Linux music player
  - scope:
      type: guide
    values:
      layout: default
  - scope:
      type: reference
    values:
      layout: default

jekyll_vitepress:
  seo:
    page_type: TechArticle
    image:
      path: /magicspot/oled-review/after-oled-normal.png
      alt: MagicSpot lyrics sidebar in neutral OLED (native Windows demo capture)
    publisher:
      type: Person
      name: FallenG101
      url: https://github.com/FallenG101
      same_as:
        - https://github.com/FallenG101/MagicSpot2
  llms:
    title: MagicSpot
    description: >-
      Documentation for a native Spotify client for Linux, macOS,
      and Windows. It covers local playback, library access, and Spotify
      Connect.
    full: true
    details: >-
      Covers installation, sign-in, everyday use, settings, and Spotify
      connections. Source is on
      [GitHub](https://github.com/FallenG101/MagicSpot2).
  branding:
    site_title: MagicSpot
    logo:
      default: /assets/images/logo.svg
      alt: MagicSpot
  syntax:
    light_theme: github
    dark_theme: github.dark
  footer:
    enabled: true
    show_on_docs: false
    message: >-
      MagicSpot is based on <a href="https://github.com/crmne/spotifast">Spotifast</a> by Carmine Paolino and contributors.
    copyright: >-
      Independent of Spotify. Spotify is a trademark of Spotify AB. Original MIT and asset license notices are retained.
  doc_footer:
    enabled: true
    previous_label: Previous page
    next_label: Next page
  last_updated:
    enabled: true
    text: Last updated
    format: "%Y-%m-%d %H:%M"
  edit_link:
    enabled: true
    pattern: "https://github.com/FallenG101/MagicSpot2/edit/main/docs/:path"
    text: Edit this page on GitHub
  github_star:
    enabled: true
    repository: FallenG101/MagicSpot2
    text: Star
    show_count: true
  github_sponsor:
    enabled: false
    user: crmne
    text: Sponsor

plugins:
  - jekyll-redirect-from
  - jekyll-vitepress-theme

exclude:
  - README.md
  - magicspot/*.md
  - assets/**/README.md
  - _site
  - .jekyll-cache
  - .sass-cache
  - .bundle
  - vendor
  - Gemfile
  - Gemfile.lock
