name: Bug report
description: Something does not work, or the app crashed or vanished.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please include the log from MagicSpot's last run:

        - Linux: `~/.local/state/magicspot2/magicspot2.log`
        - macOS: `~/Library/Application Support/com.FallenG101.magicspot2/magicspot2.log`
        - Windows: `%LOCALAPPDATA%\FallenG101\magicspot2\data\magicspot2.log`

        If the app crashed or vanished, include `panic.log` from the same folder. Review logs for private details; never attach credentials or token files.
  - type: input
    id: version
    attributes:
      label: MagicSpot version and how you installed it
      placeholder: "2.0.0 from the Windows x64 EXE / universal macOS DMG / source build"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: os_details
    attributes:
      label: System details
      description: Distribution and desktop on Linux, or the OS version.
      placeholder: "Arch, Hyprland, PipeWire / macOS 15.6 / Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: plan
    attributes:
      label: Spotify plan
      options:
        - Premium
        - Free
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What did you do, and what happened instead?
      placeholder: "1. Signed in. 2. Pressed play on a playlist. 3. Nothing played; the button kept spinning."
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: magicspot2.log
      description: Reproduce the problem, quit the app, then paste the whole file here (and panic.log, if there is one). Paths are above.
      render: text
    validations:
      required: true
